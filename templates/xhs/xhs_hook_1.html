<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 1080px; 
            height: 1440px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .title {
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .info {
            font-size: 48px;
            text-align: center;
            opacity: 0.9;
        }
        .date {
            position: absolute;
            bottom: 60px;
            font-size: 36px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="title">{{title}}</div>
    <div class="info">点击查看详细信息</div>
    <div class="date">{{date}} | {{source}}</div>
</body>
</html>
