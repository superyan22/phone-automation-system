<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 1080px; 
            height: 1440px; 
            background: #f5f5f5;
            font-family: 'Microsoft YaHei', sans-serif;
            padding: 60px;
        }
        .header {
            background: white;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .title {
            font-size: 56px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .content {
            font-size: 36px;
            color: #666;
            line-height: 1.6;
        }
        .positions {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .position-item {
            padding: 20px 0;
            border-bottom: 1px solid #eee;
            font-size: 32px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">{{title}}</div>
        <div class="content">数据来源：{{source}}</div>
    </div>
    <div class="positions">
        <div class="position-item">综合岗 - 5人</div>
        <div class="position-item">技术岗 - 10人</div>
        <div class="position-item">管理岗 - 15人</div>
    </div>
</body>
</html>
