# docker-compose.yml
version: '3.8'

services:
  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phone-automation-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-***}@postgres:5432/${POSTGRES_DB:-phone_automation}
      - REDIS_URL=redis://redis:${REDIS_PASSWORD:-***}@redis:6379/0
      - CELERY_BROKER_URL=redis://redis:${REDIS_PASSWORD:-***}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:${REDIS_PASSWORD:-***}@redis:6379/2
    volumes:
      - backend_data:/app/data
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phone-automation-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: phone-automation-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-***}
      - POSTGRES_DB=${POSTGRES_DB:-phone_automation}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: phone-automation-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-***}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # Celery worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phone-automation-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-***}@postgres:5432/${POSTGRES_DB:-phone_automation}
      - REDIS_URL=redis://redis:${REDIS_PASSWORD:-***}@redis:6379/0
      - CELERY_BROKER_URL=redis://redis:${REDIS_PASSWORD:-***}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:${REDIS_PASSWORD:-***}@redis:6379/2
    volumes:
      - backend_data:/app/data
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  # pgAdmin (optional, for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: phone-automation-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app-network
    profiles:
      - debug  # Only enable in debug mode

# Data volumes
volumes:
  backend_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

# Networks
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
