# docker-compose.yml

services:
  # Backend service - 使用host网络访问宿主机ADB
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phone-automation-backend
    restart: unless-stopped
    network_mode: host
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:***@localhost:5432/phone_automation
      - REDIS_URL=redis://***@localhost:6379/0
      - CELERY_BROKER_URL=redis://***@localhost:6379/1
      - CELERY_RESULT_BACKEND=redis://***@localhost:6379/2
      - ADB_PATH=/usr/bin/adb

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phone-automation-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: phone-automation-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=***      - POSTGRES_DB=phone_automation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: phone-automation-redis
    restart: unless-stopped
    command: redis-server --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

# Data volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# Networks
networks:
  app-network:
    driver: bridge
